<app-new-rules [rules]="savedRules" (rulesSaved)="onRulesSaved($event)"></app-new-rules>

<div class="toast" *ngIf="showToast">
  <span class="toast-icon material-symbols-outlined">check_circle</span>
  <span class="toast-message">Rules saved successfully.</span>
  <button class="toast-close" (click)="dismissToast()">
    <span class="material-symbols-outlined">close</span>
  </button>
</div>

<div class="saved-output" *ngIf="savedRules.length">
  <h3>Saved Rules</h3>
  <ul>
    <li *ngFor="let rule of savedRules">
      Rule {{ rule.id }} — Variation: {{ rule.variation }}, Source: {{ rule.source }}
    </li>
  </ul>
</div>
